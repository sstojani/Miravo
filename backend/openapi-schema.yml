components:
  schemas:
    Account:
      type: object
      description: Model serializer with strict input-field handling.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tracker_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/TypeEnum'
        currency:
          type: string
          maxLength: 3
        currency_exponent:
          type: integer
          readOnly: true
        opening_balance_minor:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        opening_date:
          type: string
          format: date
        color:
          type: string
          maxLength: 16
        icon:
          type: string
          maxLength: 80
        include_in_net_worth:
          type: boolean
        credit_limit_minor:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        balance_minor:
          type: integer
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - balance_minor
      - created_at
      - currency
      - currency_exponent
      - id
      - name
      - opening_date
      - tracker_id
      - type
      - updated_at
      - version
    AccountRequest:
      type: object
      description: Model serializer with strict input-field handling.
      properties:
        tracker_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/TypeEnum'
        currency:
          type: string
          minLength: 1
          maxLength: 3
        opening_balance_minor:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        opening_date:
          type: string
          format: date
        color:
          type: string
          minLength: 1
          maxLength: 16
        icon:
          type: string
          minLength: 1
          maxLength: 80
        include_in_net_worth:
          type: boolean
        credit_limit_minor:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
      required:
      - currency
      - name
      - opening_date
      - tracker_id
      - type
