name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODE_PATH: /Applications/Xcode_16.4.app
  EXPECTED_APP_NAME: Miravo
  EXPECTED_BUNDLE_ID: com.example.projectledger
  EXPECTED_MINIMUM_IOS: "18.0"

jobs:
  unsigned-device-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select and report toolchain
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          sw_vers
          xcodebuild -version
          swift --version
          xcbeautify --version

      - name: Install pinned XcodeGen
        run: |
          brew install mint ripgrep
          mint install "yonaskolb/XcodeGen@$XCODEGEN_VERSION"
          echo "$HOME/.mint/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.mint/bin/xcodegen" --version)" = "Version: $XCODEGEN_VERSION"

      - name: Generate a clean project
        working-directory: ios
        run: |
          python3 check-project-contract.py
          ./check-localizations.sh
          swiftformat . --config .swiftformat --lint
          xcodegen generate --spec project.yml
          git diff --exit-code -- .

      - name: Scan application source for production-secret patterns
        run: |
          if rg -n --hidden --glob '*.swift' --glob '*.plist' \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@)' \
            ios/ProjectLedger ios/Resources; then
            echo "Potential secret pattern found in iOS source." >&2
            exit 1
          fi

      - name: Build unsigned Release app for a physical device
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectLedger.xcodeproj \
            -scheme ProjectLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | xcbeautify

      - name: Verify and package UNSIGNED artifact
        working-directory: ios
        run: |
          set -Eeuo pipefail

          app="$PWD/build/Release-iphoneos/Miravo.app"
          info="$app/Info.plist"
          executable="$app/Miravo"
          artifacts="$PWD/artifacts"
          stage="$PWD/unsigned-stage"

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          echo "Verifying built Miravo application..."

          [[ -d "$app" ]] || fail "Miravo.app was not produced."
          [[ -f "$info" ]] || fail "Miravo.app/Info.plist is missing."
          [[ -f "$executable" ]] || fail "Miravo executable is missing."

          if [[ ! -f "$app/Assets.car" ]] &&              ! find "$app" -maxdepth 1 -name 'AppIcon*.png' -print -quit | grep -q .; then
            fail "Compiled app icon assets are missing from Miravo.app."
          fi

          app_name="$(plutil -extract CFBundleDisplayName raw "$info")"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$info")"
          minimum_ios="$(plutil -extract MinimumOSVersion raw "$info")"
          version="$(plutil -extract CFBundleShortVersionString raw "$info")"
          build_number="$(plutil -extract CFBundleVersion raw "$info")"
          architectures="$(lipo -archs "$executable")"
          icon_name="$(plutil -extract CFBundleIconName raw "$info" 2>/dev/null || true)"

          echo "App name: $app_name"
          echo "Bundle ID: $bundle_id"
          echo "Version: $version ($build_number)"
          echo "Minimum iOS: $minimum_ios"
          echo "Architectures: $architectures"
          echo "App icon: $icon_name"

          [[ "$icon_name" == "AppIcon" ]] ||
            fail "Built app does not declare AppIcon as its primary icon."

          [[ "$app_name" == "$EXPECTED_APP_NAME" ]] ||
            fail "Unexpected app name: $app_name"

          [[ "$bundle_id" == "$EXPECTED_BUNDLE_ID" ]] ||
            fail "Unexpected bundle identifier: $bundle_id"

          echo "$architectures" | grep -qw arm64 ||
            fail "Built executable does not contain arm64."

          if codesign --verify "$app" >/dev/null 2>&1; then
            fail "Expected an unsigned app but code-signature verification succeeded."
          fi

          privacy_manifest_source="$PWD/Resources/PrivacyInfo.xcprivacy"

          if [[ ! -f "$app/PrivacyInfo.xcprivacy" ]]; then
            [[ -f "$privacy_manifest_source" ]] ||
              fail "Source PrivacyInfo.xcprivacy is missing."

            echo "PrivacyInfo.xcprivacy was not embedded by XcodeGen."
            echo "Copying the repository privacy manifest into the unsigned app bundle."

            ditto               "$privacy_manifest_source"               "$app/PrivacyInfo.xcprivacy"
          fi

          [[ -f "$app/PrivacyInfo.xcprivacy" ]] ||
            fail "PrivacyInfo.xcprivacy could not be added to Miravo.app."

          plutil -lint "$app/PrivacyInfo.xcprivacy"

          privacy_tracking="$(
            plutil -extract NSPrivacyTracking raw "$app/PrivacyInfo.xcprivacy"
          )"

          [[ "$privacy_tracking" == "false" ]] ||
            fail "Privacy manifest unexpectedly enables tracking."

          echo "Privacy manifest verified."

          command -v rg >/dev/null ||
            fail "ripgrep (rg) is unavailable."

          strings_file="$PWD/miravo-executable-strings.txt"
          strings "$executable" > "$strings_file"

          if rg -q \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@)' \
            "$strings_file"; then
            rm -f "$strings_file"
            fail "Potential production secret found in compiled application."
          fi

          rm -f "$strings_file"

          echo "Application verification succeeded."
          echo "Packaging unsigned IPA..."

          rm -rf "$artifacts" "$stage"
          mkdir -p "$artifacts" "$stage/Payload"

          ditto "$app" "$stage/Payload/Miravo.app"

          (
            cd "$stage"
            ditto -c -k --keepParent Payload \
              "$artifacts/Miravo-UNSIGNED.ipa"
          )

          unzip -t "$artifacts/Miravo-UNSIGNED.ipa"

          unzip -l "$artifacts/Miravo-UNSIGNED.ipa" \
            > "$artifacts/ipa-contents.txt"

          grep -Fq "Payload/Miravo.app/Info.plist" \
            "$artifacts/ipa-contents.txt" ||
            fail "Packaged IPA does not contain Miravo.app/Info.plist."

          rm -f "$artifacts/ipa-contents.txt"

          jq -n \
            --arg label "UNSIGNED" \
            --arg commit "$GITHUB_SHA" \
            --arg build_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macos "$(sw_vers -productVersion)" \
            --arg xcode "$(xcodebuild -version | tr '\n' ' ')" \
            --arg swift "$(swift --version | head -n1)" \
            --arg app_name "$app_name" \
            --arg bundle_id "$bundle_id" \
            --arg version "$version" \
            --arg build_number "$build_number" \
            --arg minimum_ios "$minimum_ios" \
            --arg architectures "$architectures" \
            '{
              label:$label,
              commit:$commit,
              build_date:$build_date,
              macos:$macos,
              xcode:$xcode,
              swift:$swift,
              app_name:$app_name,
              bundle_id:$bundle_id,
              version:$version,
              build_number:$build_number,
              minimum_ios:$minimum_ios,
              architectures:$architectures,
              code_signing:false
            }' > "$artifacts/build-manifest.json"

          (
            cd "$artifacts"
            shasum -a 256 Miravo-UNSIGNED.ipa \
              > Miravo-UNSIGNED.ipa.sha256
          )

          dsym="$PWD/build/Release-iphoneos/Miravo.app.dSYM"
          if [[ -d "$dsym" ]]; then
            ditto -c -k --keepParent \
              "$dsym" \
              "$artifacts/Miravo.app.dSYM.zip"
          fi

          echo "Unsigned IPA successfully created:"
          ls -lh "$artifacts/Miravo-UNSIGNED.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Miravo-UNSIGNED-${{ github.sha }}
          path: ios/artifacts/
          if-no-files-found: error
          retention-days: 30
