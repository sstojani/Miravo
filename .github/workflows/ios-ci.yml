name: iOS CI

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the full iOS unit and UI test suite
        required: false
        default: false
        type: boolean
      run_navigation_smoke:
        description: Run the focused More and Settings navigation UI smoke test
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODE_PATH: /Applications/Xcode_16.4.app

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select and report toolchain
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          sw_vers
          xcodebuild -version
          swift --version
          swiftformat --version
          xcbeautify --version

      - name: Install pinned XcodeGen
        run: |
          brew install mint ripgrep
          mint install "yonaskolb/XcodeGen@$XCODEGEN_VERSION"
          echo "$HOME/.mint/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.mint/bin/xcodegen" --version)" = "Version: $XCODEGEN_VERSION"

      - name: Validate source resources
        run: |
          plutil -lint ios/ProjectLedger/Info.plist ios/ProjectLedger/Info.Debug.plist ios/Resources/PrivacyInfo.xcprivacy
          chmod +x ios/check-localizations.sh
          ios/check-localizations.sh
          python3 ios/check-project-contract.py
          swiftformat --config ios/.swiftformat --lint ios/ProjectLedger ios/ProjectLedgerTests ios/ProjectLedgerUITests

      - name: Generate project and prove generation did not alter sources
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- .
          xcodebuild -project ProjectLedger.xcodeproj -list

      - name: Scan application source for production-secret patterns
        run: |
          if rg -n --hidden --glob '*.swift' --glob '*.plist' \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@)' \
            ios/ProjectLedger ios/Resources; then
            echo "Potential secret pattern found in iOS source." >&2
            exit 1
          fi

      - name: Prepare iOS Simulator for manual tests
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_tests || inputs.run_navigation_smoke) }}
        run: |
          set -euxo pipefail

          echo "Installed runtimes before setup:"
          xcrun simctl list runtimes

          if ! xcrun simctl list runtimes available | grep -q "iOS"; then
            echo "No usable iOS Simulator runtime is installed. Downloading one..."
            xcodebuild -downloadPlatform iOS
          fi

          RUNTIME_ID="$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [
              r for r in data["runtimes"]
              if r.get("isAvailable") and ".iOS-" in r.get("identifier", "")
          ]
          if not runtimes:
              raise SystemExit("No available iOS runtime after download")
          runtimes.sort(key=lambda r: tuple(map(int, r["version"].split("."))), reverse=True)
          print(runtimes[0]["identifier"])
          ')"

          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = data["devicetypes"]
          preferred = next((d for d in devices if d["name"] == "iPhone 16"), None)
          if preferred is None:
              preferred = next((d for d in devices if d["name"].startswith("iPhone")), None)
          if preferred is None:
              raise SystemExit("No iPhone simulator device type available")
          print(preferred["identifier"])
          ')"

          DEVICE_UDID="$(xcrun simctl create "Miravo CI iPhone" "$DEVICE_TYPE_ID" "$RUNTIME_ID")"

          echo "Created simulator: $DEVICE_UDID"
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$DEVICE_UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl list devices available

      - name: Build simulator app
        working-directory: ios
        run: |
          set -o pipefail
          DESTINATION="${SIMULATOR_DESTINATION:-generic/platform=iOS Simulator}"
          xcodebuild \
            -project ProjectLedger.xcodeproj \
            -scheme ProjectLedger \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            build | xcbeautify

      - name: Run full simulator tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectLedger.xcodeproj \
            -scheme ProjectLedger \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/ProjectLedgerTests.xcresult \
            test | xcbeautify

      - name: Run navigation smoke test (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_navigation_smoke && !inputs.run_tests }}
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p DerivedData/Logs
          (
            for attempt in $(seq 1 90); do
              APP_PID="$(pgrep -x Miravo | head -n 1 || true)"
              if [ -n "$APP_PID" ]; then
                sleep 65
                if kill -0 "$APP_PID" 2>/dev/null; then
                  xcrun simctl io booted screenshot DerivedData/Logs/Miravo-navigation.png || true
                  sample "$APP_PID" 5 -file DerivedData/Logs/Miravo-navigation.sample.txt || true
                fi
                break
              fi
              sleep 2
            done
          ) &
          SAMPLER_PID=$!
          trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT
          xcodebuild \
            -project ProjectLedger.xcodeproj \
            -scheme ProjectLedger \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/ProjectLedgerNavigationSmoke.xcresult \
            -only-testing:ProjectLedgerUITests/ProjectLedgerUITests/testMoreAndSettingsDestinationsRemainNavigable \
            test | xcbeautify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ios/DerivedData/ProjectLedgerTests.xcresult
            ios/DerivedData/ProjectLedgerNavigationSmoke.xcresult
            ios/DerivedData/Logs
          retention-days: 14
