name: iOS Test Diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed iOS CI run ID
        required: true
        type: string

jobs:
  inspect:
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: results

      - name: Inspect navigation failure
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(find results -name 'ProjectLedgerNavigationSmoke.xcresult' -type d -print -quit)"
          test -n "$RESULT"
          xcrun xcresulttool get test-results summary --path "$RESULT"
          xcrun xcresulttool get test-results tests --path "$RESULT"
          xcrun xcresulttool get test-results test-details \
            --path "$RESULT" \
            --test-id 'ProjectLedgerUITests/testMoreAndSettingsDestinationsRemainNavigable()' || true
          xcrun xcresulttool get test-results activities \
            --path "$RESULT" \
            --test-id 'ProjectLedgerUITests/testMoreAndSettingsDestinationsRemainNavigable()' || true
